name: Daily flight price check

# Price history only means something if it persists between runs, so this
# workflow commits the SQLite database back to the repo after each check.

on:
  schedule:
    # 11:10 UTC = 07:10 America/New_York (EDT) / 06:10 (EST)
    - cron: "10 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker and email the report
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
        run: python -m flight_tracker.main --email

      # always() matters: a single airline returning no results must never
      # cost us the readings that did succeed.
      - name: Persist price history
        if: always()
        run: |
          git config user.name  "flight-tracker"
          git config user.email "actions@github.com"
          git add data/prices.db out/latest.html out/latest.txt
          git diff --staged --quiet || git commit -m "prices: $(date -u +%Y-%m-%d)"
          git push

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-report
          path: out/
